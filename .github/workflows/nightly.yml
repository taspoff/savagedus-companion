name: Build Nightly Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checks syntaxe JS (comme ta CI actuelle)
        run: |
          for f in scripts/*.js; do
            node --check "$f"
          done

      - name: Injecter la version nightly
        run: |
          VERSION="nightly-$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}"
          node -e "
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync('module.json', 'utf8'));
            m.version = '${VERSION}';
            m.download = 'https://github.com/taspoff/savagedus-companion/releases/download/foundry-nightly/savagedus-companion.zip';
            m.manifest = 'https://github.com/taspoff/savagedus-companion/releases/download/foundry-nightly/module.json';
            fs.writeFileSync('module.json', JSON.stringify(m, null, 2));
          "
          echo "NIGHTLY_VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Créer le ZIP
        run: zip -r savagedus-companion.zip module.json LICENSE README.md scripts/

      - name: Supprimer l'ancienne release nightly
        run: gh release delete foundry-nightly --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publier la release
        run: |
          gh release create foundry-nightly \
            savagedus-companion.zip module.json \
            --prerelease \
            --title "Nightly ${NIGHTLY_VERSION}" \
            --notes "Build automatique du $(date -u '+%d/%m/%Y %H:%M UTC'). Version ${NIGHTLY_VERSION}."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
