name: Vérification syntaxe

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Vérification syntaxe des scripts
        run: |
          node --check scripts/main.js
          node --check scripts/matcher.js
          node --check scripts/importer.js

      - name: Vérification du module.json
        run: node -e "JSON.parse(require('fs').readFileSync('module.json','utf8')); console.log('module.json valide')"
